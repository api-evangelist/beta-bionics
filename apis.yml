aid: beta-bionics
name: Beta Bionics
description: 'Beta Bionics, Inc. (Nasdaq: BBNX) is a commercial-stage medical technology
  company in Irvine, California and Boston, Massachusetts that designs, develops and
  commercializes the iLet Bionic Pancreas — an FDA-cleared automated insulin delivery
  system made up of the iLet ACE Pump and the iLet Dosing Decision Software, paired
  with a Dexcom G6/G7 or Abbott FreeStyle Libre 3 Plus continuous glucose monitor.
  The iLet initializes on body weight alone and determines 100% of insulin doses without
  carb counting, correction factors or preset basal rates. Device data flows from the
  pump to the iLet mobile app and on to the Beta Bionics cloud, where it feeds the
  Bionic Circle follower app (up to 10 caregivers), clinician reporting in the Bionic
  (HCP) Portal, and uploads to Glooko for remote patient monitoring. Beta Bionics publishes
  near-real-time real-world outcomes for its whole connected population on a public
  dashboard. There is no public developer program, no published API documentation and
  no machine-readable API contract: the cloud APIs behind the portal and mobile apps
  are private, HIPAA-regulated, and gated behind Amazon Cognito.'
